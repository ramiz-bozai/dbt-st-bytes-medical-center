# No secrets in this file — all values come from environment variables.
# Local: source .env  |  Databricks jobs: DBT_ACCESS_TOKEN is injected automatically.

st_bytes_medical_center:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG_DEV') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA_DEV') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 16

    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG_PROD') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA_PROD') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 16
