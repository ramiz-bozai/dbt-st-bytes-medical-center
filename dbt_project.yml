config-version: 2

name: "st_bytes_medical_center"
version: "1.0.0"
require-dbt-version: ">=1.6.0"

profile: st_bytes_medical_center

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# query-comment:
#   comment: "{{ query_comment_json() }}"
#   append: true

vars:
  synthea_volume_path: "/Volumes/ramiz_fevm_gcp_central1/raw_uploads/synthea_csvs"

models:
  st_bytes_medical_center:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: streaming_table
      +auto_liquid_cluster: true
      stg_allergies:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_supplies:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Operations"}'
      stg_providers:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Operations"}'
      stg_procedures:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_payers:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Revenue cycle"}'
      stg_payer_transitions:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Revenue cycle"}'
      stg_patients:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Patient"}'
      stg_organizations:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Operations"}'
      stg_observations:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_medications:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_immunizations:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_imaging_studies:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_encounters:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Operations"}'
      stg_devices:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_conditions:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
      stg_claims_transactions:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Revenue cycle"}'
      stg_claims:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Revenue cycle"}'
      stg_careplans:
        +query_tags: '{"layer":"silver","dbt_layer":"staging","domain":"Clinical"}'
    intermediate:
      +schema: intermediate
      +materialized: table
      +auto_liquid_cluster: true
      int_patient_demographics:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Patient"}'
      int_observations_vitals:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Clinical"}'
      int_latest_vitals:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Clinical"}'
      int_patient_active_conditions:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Clinical"}'
      int_encounter_clinical_counts:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Operations"}'
      int_claim_financials:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Revenue cycle"}'
      int_claims_enriched:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Revenue cycle"}'
      int_claims_with_financials:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Revenue cycle"}'
      int_encounters_enriched:
        +query_tags: '{"layer":"silver","dbt_layer":"intermediate","domain":"Operations"}'
    marts:
      +schema: marts
      +materialized: table
      +auto_liquid_cluster: true
      dim_patients:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
        +post-hook:
          - "ALTER TABLE {{ this }} ALTER COLUMN first_name SET TAGS ('customer_pii' = 'name')"
          - "ALTER TABLE {{ this }} ALTER COLUMN last_name SET TAGS ('customer_pii' = 'name')"
      dim_providers:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
      dim_organizations:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
      dim_payers:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      fct_encounters:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
      fct_claims:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      fct_claim_transactions:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      fct_conditions:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_procedures:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_medications:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_observations:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_immunizations:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_allergies:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_care_plans:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      fct_imaging_studies:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      mart_patient_summary:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
      mart_encounter_cost_analysis:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
      mart_provider_panel:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
      mart_organization_utilization:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
      mart_payer_financials:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      mart_population_health:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Population"}'
      mart_revenue_cycle:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      mart_chronic_conditions:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      mart_medication_utilization:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      mart_immunization_coverage:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Population"}'
      mart_encounter_class_distribution:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Population"}'
      mart_imaging_by_modality:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      mart_vital_signs_latest:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
      mart_claims_aging:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      mart_allergy_registry:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      mart_care_plan_registry:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
      mart_patient_coverage_timeline:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
      mv_revenue_cycle_kpis:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
      mv_encounter_volume_by_class:
        +query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Population"}'
    metrics:
      +schema: metrics
      +materialized: metric_view
      metric_rc_transactions:
        +query_tags: '{"layer":"gold","dbt_layer":"metrics","domain":"Revenue cycle"}'
      metric_rc_claims:
        +query_tags: '{"layer":"gold","dbt_layer":"metrics","domain":"Revenue cycle"}'
      metric_rc_encounter_costs:
        +query_tags: '{"layer":"gold","dbt_layer":"metrics","domain":"Revenue cycle"}'

seeds:
  st_bytes_medical_center:
    +persist_docs:
      relation: true
      columns: true
    st_bytes_medical_center:
      +schema: raw_st_bytes_medical_center
      patients:
        +alias: raw_patients
      providers:
        +alias: raw_providers
      organizations:
        +alias: raw_organizations
      payers:
        +alias: raw_payers
      encounters:
        +alias: raw_encounters
      claims:
        +alias: raw_claims
      claims_transactions:
        +alias: raw_claims_transactions
      conditions:
        +alias: raw_conditions
      procedures:
        +alias: raw_procedures
      observations:
        +alias: raw_observations
      medications:
        +alias: raw_medications
      immunizations:
        +alias: raw_immunizations
      allergies:
        +alias: raw_allergies
      careplans:
        +alias: raw_careplans
      devices:
        +alias: raw_devices
      supplies:
        +alias: raw_supplies
      imaging_studies:
        +alias: raw_imaging_studies
      payer_transitions:
        +alias: raw_payer_transitions
