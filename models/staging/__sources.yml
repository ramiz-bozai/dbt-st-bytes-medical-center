version: 2

# Synthea CSVs are ingested directly in staging streaming tables via read_files()
# from the Unity Catalog volume (see stream_read_synthea_csv macro).

sources:
  - name: synthea_volume
    description: >
      Synthea CSV exports in Unity Catalog volume
      /Volumes/ramiz_fevm_catalog/raw_uploads/synthea_csv.
      Staging models ingest via stream read_files().
    database: ramiz_fevm_catalog
    schema: staging
    tables:
      - name: raw_patients
      - name: raw_providers
      - name: raw_organizations
      - name: raw_payers
      - name: raw_encounters
      - name: raw_claims
      - name: raw_claims_transactions
      - name: raw_conditions
      - name: raw_procedures
      - name: raw_observations
      - name: raw_medications
      - name: raw_immunizations
      - name: raw_careplans
      - name: raw_devices
      - name: raw_supplies
      - name: raw_imaging_studies
      - name: raw_payer_transitions

  - name: postgres_allergies
    description: Tabular data on allergies from the postgres database.
    database: postgres_st_bytes_catalog
    schema: public
    tables:
      - name: raw_allergies
