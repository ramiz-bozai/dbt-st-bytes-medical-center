version: 2

models:
  - name: stg_patients
    description: Silver patient demographics (PII columns from bronze excluded downstream).
    columns:
      - name: patient_id
        tests: [unique, not_null]
  - name: stg_encounters
    description: Silver clinical encounters.
    columns:
      - name: encounter_id
        tests: [unique, not_null]
      - name: patient_id
        tests: [not_null]
  - name: stg_claims
    columns:
      - name: claim_id
        tests: [unique, not_null]
  - name: stg_claims_transactions
    columns:
      - name: claim_transaction_id
        tests: [unique, not_null]
  - name: stg_providers
    columns:
      - name: provider_id
        tests: [unique, not_null]
  - name: stg_organizations
    columns:
      - name: organization_id
        tests: [unique, not_null]
  - name: stg_payers
    columns:
      - name: payer_id
        tests: [unique, not_null]
