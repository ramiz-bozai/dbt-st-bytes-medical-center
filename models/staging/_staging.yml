version: 2

models:
  - name: stg_allergies
    description: "Stages allergy and intolerance records with typed dates and an active-status flag."
    columns:
      - name: allergy_start_date
        description: "Allergy or intolerance onset date."
      - name: allergy_end_date
        description: "Allergy or intolerance resolution date, if recorded."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: allergy_code
        description: "Allergy substance or product code."
      - name: code_system
        description: "Vocabulary system for the clinical or billing code."
      - name: allergy_description
        description: "Human-readable allergy description."
      - name: allergy_type
        description: "Allergy record type (for example allergy, intolerance)."
      - name: allergy_category
        description: "Allergy category (for example food, medication, environment)."
      - name: is_active
        description: "True when the record has no end date and is considered active."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: stg_supplies
    description: "Stages supply usage events with renamed keys and typed dates and quantities."
    columns:
      - name: supply_date
        description: "Supply usage date."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: supply_code
        description: "Supply product code."
      - name: supply_description
        description: "Human-readable supply description."
      - name: quantity
        description: "Quantity of supplies used."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: stg_providers
    description: "Stages provider master data with renamed identifiers, geolocation, and lifetime activity counts."
    columns:
      - name: provider_id
        description: "Unique provider identifier."
        tests: [unique, not_null]
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: provider_name
        description: "Provider display name."
      - name: gender
        description: "Patient gender."
      - name: specialty
        description: "Provider clinical specialty."
      - name: address
        description: "Street address."
      - name: city
        description: "City name."
      - name: state
        description: "State or region code."
      - name: zip
        description: "Postal or ZIP code."
      - name: latitude
        description: "Geographic latitude in decimal degrees."
      - name: longitude
        description: "Geographic longitude in decimal degrees."
      - name: lifetime_encounters
        description: "Lifetime encounter count attributed to the provider."
      - name: lifetime_procedures
        description: "Lifetime procedure count attributed to the provider."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: stg_procedures
    description: "Stages clinical procedure events with standardized timestamps, codes, and costs."
    columns:
      - name: procedure_start_at
        description: "Procedure start timestamp."
      - name: procedure_end_at
        description: "Procedure end timestamp."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: code_system
        description: "Vocabulary system for the clinical or billing code."
      - name: procedure_code
        description: "Procedure or service code on the transaction or clinical record."
      - name: procedure_description
        description: "Human-readable procedure description."
      - name: base_cost
        description: "Base cost for the clinical or supply event."
      - name: reason_code
        description: "Clinical or administrative reason code."
      - name: reason_description
        description: "Human-readable reason description."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: stg_payers
    description: "Stages payer and insurer attributes with financial and membership aggregates."
    columns:
      - name: payer_id
        description: "Unique insurance payer identifier."
        tests: [unique, not_null]
      - name: payer_name
        description: "Payer display name."
      - name: ownership
        description: "Ownership classification for the payer."
      - name: amount_covered
        description: "Total amount covered by the payer."
      - name: amount_uncovered
        description: "Total amount not covered by the payer."
      - name: revenue
        description: "Reported payer or organization revenue."
      - name: covered_encounters
        description: "Count of encounters covered by the payer."
      - name: uncovered_encounters
        description: "Count of encounters not covered by the payer."
      - name: unique_customers
        description: "Distinct customer count for the payer."
      - name: quality_of_life_avg
        description: "Average quality-of-life score for payer members."
      - name: member_months
        description: "Total member months for the payer population."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

