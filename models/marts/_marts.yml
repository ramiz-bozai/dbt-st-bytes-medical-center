version: 2

models:
  - name: dim_patients
    description: Gold patient dimension with age bands and mortality flag.
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
    columns:
      - name: patient_id
        tests: [unique, not_null]

  - name: mart_patient_summary
    description: One row per patient with utilization and financial rollups.
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
    columns:
      - name: patient_id
        tests: [unique, not_null]

  - name: mart_patient_coverage_timeline
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'

  - name: mart_vital_signs_latest
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'

  - name: dim_providers
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'

  - name: dim_organizations
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'

  - name: fct_encounters
    description: Gold encounter fact with provider, organization, and payer context.
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: encounter_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patients')
                field: patient_id

  - name: mart_organization_utilization
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'

  - name: mart_provider_panel
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'

  - name: mart_encounter_cost_analysis
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'

  - name: dim_payers
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'

  - name: fct_claims
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
