version: 2

models:
  - name: dim_patients
    description: "Gold patient dimension exposing derived demographics for analytics and joins."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
    columns:
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
        tests: [unique, not_null]
      - name: birth_date
        description: "Patient date of birth."
      - name: death_date
        description: "Patient date of death, if recorded."
      - name: first_name
        description: "Patient given name."
      - name: last_name
        description: "Patient family name."
      - name: gender
        description: "Patient gender."
      - name: race
        description: "Patient race category from source data."
      - name: ethnicity
        description: "Patient ethnicity category from source data."
      - name: city
        description: "City name."
      - name: state
        description: "State or region code."
      - name: zip
        description: "Postal or ZIP code."
      - name: annual_income
        description: "Estimated annual household income."
      - name: lifetime_healthcare_expenses
        description: "Lifetime healthcare expenses attributed to the patient."
      - name: lifetime_coverage_amount
        description: "Lifetime insurance coverage amount attributed to the patient."
      - name: is_alive
        description: "True when the patient has no recorded death date."
      - name: age_years
        description: "Patient age in whole years at reference date or death."
      - name: age_band
        description: "Patient age segment (pediatric, adult, senior, or deceased)."

  - name: dim_providers
    description: "Gold provider dimension with location and lifetime activity metrics."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: provider_id
        description: "Unique provider identifier."
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: provider_name
        description: "Provider display name."
      - name: gender
        description: "Patient gender."
      - name: specialty
        description: "Provider clinical specialty."
      - name: city
        description: "City name."
      - name: state
        description: "State or region code."
      - name: zip
        description: "Postal or ZIP code."
      - name: lifetime_encounters
        description: "Lifetime encounter count attributed to the provider."
      - name: lifetime_procedures
        description: "Lifetime procedure count attributed to the provider."

  - name: dim_organizations
    description: "Gold organization dimension with geolocation and utilization attributes."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: organization_name
        description: "Organization or facility display name."
      - name: address
        description: "Street address."
      - name: city
        description: "City name."
      - name: state
        description: "State or region code."
      - name: zip
        description: "Postal or ZIP code."
      - name: latitude
        description: "Geographic latitude in decimal degrees."
      - name: longitude
        description: "Geographic longitude in decimal degrees."
      - name: phone
        description: "Contact phone number."
      - name: revenue
        description: "Reported payer or organization revenue."
      - name: utilization
        description: "Reported organization utilization metric from source."

  - name: dim_payers
    description: "Gold payer dimension with coverage and membership financial attributes."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
    columns:
      - name: payer_id
        description: "Unique insurance payer identifier."
      - name: payer_name
        description: "Payer display name."
      - name: ownership
        description: "Ownership classification for the payer."
      - name: amount_covered
        description: "Total amount covered by the payer."
      - name: amount_uncovered
        description: "Total amount not covered by the payer."
      - name: revenue
        description: "Reported payer or organization revenue."
      - name: covered_encounters
        description: "Count of encounters covered by the payer."
      - name: uncovered_encounters
        description: "Count of encounters not covered by the payer."
      - name: unique_customers
        description: "Distinct customer count for the payer."
      - name: quality_of_life_avg
        description: "Average quality-of-life score for payer members."
      - name: member_months
        description: "Total member months for the payer population."

  - name: fct_encounters
    description: "Gold encounter fact table with full enriched context for encounter-level analysis."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: encounter_id
        description: "Unique clinical encounter identifier."
        tests: [unique, not_null]
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patients')
                field: patient_id
      - name: provider_id
        description: "Unique provider identifier."
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: payer_id
        description: "Unique insurance payer identifier."
      - name: encounter_class
        description: "Encounter setting or class (for example ambulatory, emergency, inpatient)."
      - name: encounter_code
        description: "Encounter type code from the source vocabulary."
      - name: encounter_description
        description: "Human-readable encounter type description."
      - name: encounter_start_date
        description: "Encounter start date."
      - name: encounter_start_at
        description: "Encounter start timestamp."
      - name: encounter_end_at
        description: "Encounter end timestamp."
      - name: encounter_duration_minutes
        description: "Encounter length in minutes."
      - name: base_encounter_cost
        description: "Base cost attributed to the encounter in source currency."
      - name: total_claim_cost
        description: "Total claim cost linked to the encounter."
      - name: payer_coverage_amount
        description: "Amount covered by insurance for the encounter or item."
      - name: reason_code
        description: "Clinical or administrative reason code."
      - name: reason_description
        description: "Human-readable reason description."
      - name: age_years
        description: "Patient age in whole years at reference date or death."
      - name: age_band
        description: "Patient age segment (pediatric, adult, senior, or deceased)."
      - name: patient_gender
        description: "Patient gender carried on the encounter context."
      - name: patient_state
        description: "Patient state of residence carried on the encounter context."
      - name: is_alive
        description: "True when the patient has no recorded death date."
      - name: provider_name
        description: "Provider display name."
      - name: provider_specialty
        description: "Clinical specialty of the encounter provider."
      - name: organization_name
        description: "Organization or facility display name."
      - name: org_city
        description: "City of the organization location."
      - name: org_state
        description: "State of the organization location."
      - name: payer_name
        description: "Payer display name."
      - name: payer_ownership
        description: "Payer ownership or plan type classification."

  - name: fct_claims
    description: "Gold claim fact combining enriched claim attributes with financial aggregates."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
    columns:
      - name: claim_id
        description: "Unique claim header identifier."
        tests: [unique, not_null]
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: provider_id
        description: "Unique provider identifier."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: service_at
        description: "Primary service timestamp on the claim."
      - name: service_date
        description: "Service date derived from the claim or transaction."
      - name: status_primary
        description: "Primary payer claim status."
      - name: status_secondary
        description: "Secondary payer claim status."
      - name: outstanding_primary
        description: "Outstanding balance for the primary payer."
      - name: outstanding_secondary
        description: "Outstanding balance for the secondary payer."
      - name: diagnosis1
        description: "Primary diagnosis code on the claim."
      - name: diagnosis2
        description: "Secondary diagnosis code on the claim."
      - name: diagnosis3
        description: "Tertiary diagnosis code on the claim."
      - name: encounter_class
        description: "Encounter setting or class (for example ambulatory, emergency, inpatient)."
      - name: encounter_start_date
        description: "Encounter start date."
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: transaction_line_count
        description: "Number of financial transaction lines for the claim."
      - name: total_charges
        description: "Sum of charge amounts for the claim."
      - name: total_payments
        description: "Sum of payment amounts for the claim."
      - name: total_transfer_out
        description: "Sum of outbound transfer amounts for the claim."
      - name: total_transfer_in
        description: "Sum of inbound transfer amounts for the claim."
      - name: max_outstanding
        description: "Maximum outstanding balance observed on claim transactions."
      - name: net_balance
        description: "Net financial balance after charges, payments, and transfers."

  - name: fct_claim_transactions
    description: "Gold claim transaction fact for revenue-cycle line-item analysis."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
    columns:
      - name: claim_transaction_id
        description: "Unique claim financial transaction line identifier."
      - name: claim_id
        description: "Unique claim header identifier."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: provider_id
        description: "Unique provider identifier."
      - name: transaction_type
        description: "Claim transaction category (for example charge, payment, adjustment)."
      - name: amount
        description: "Transaction amount in source currency."
      - name: payment_method
        description: "Payment method used on the transaction."
      - name: service_date
        description: "Service date derived from the claim or transaction."
      - name: service_start_at
        description: "Service period start timestamp on the transaction."
      - name: service_end_at
        description: "Service period end timestamp on the transaction."
      - name: procedure_code
        description: "Procedure or service code on the transaction or clinical record."
      - name: department_id
        description: "Billing department identifier."
      - name: payments
        description: "Payments applied on the transaction line."
      - name: adjustments
        description: "Adjustments applied on the transaction line."
      - name: outstanding
        description: "Outstanding balance on the transaction line."
      - name: notes
        description: "Free-text notes on the transaction line."

  - name: fct_conditions
    description: "Gold condition fact table at diagnosis grain for clinical analytics."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: condition_start_date
        description: "Condition onset date."
      - name: condition_end_date
        description: "Condition resolution date, if recorded."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: code_system
        description: "Vocabulary system for the clinical or billing code."
      - name: condition_code
        description: "Diagnosis or condition code."
      - name: condition_description
        description: "Human-readable condition description."
      - name: is_active
        description: "True when the record has no end date and is considered active."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_procedures
    description: "Gold procedure fact table at procedure-event grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: procedure_start_at
        description: "Procedure start timestamp."
      - name: procedure_end_at
        description: "Procedure end timestamp."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: code_system
        description: "Vocabulary system for the clinical or billing code."
      - name: procedure_code
        description: "Procedure or service code on the transaction or clinical record."
      - name: procedure_description
        description: "Human-readable procedure description."
      - name: base_cost
        description: "Base cost for the clinical or supply event."
      - name: reason_code
        description: "Clinical or administrative reason code."
      - name: reason_description
        description: "Human-readable reason description."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_medications
    description: "Gold medication fact table at prescription grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: medication_start_at
        description: "Medication period start timestamp."
      - name: medication_end_at
        description: "Medication period end timestamp."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: payer_id
        description: "Unique insurance payer identifier."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: medication_code
        description: "Medication product code."
      - name: medication_description
        description: "Human-readable medication description."
      - name: base_cost
        description: "Base cost for the clinical or supply event."
      - name: payer_coverage_amount
        description: "Amount covered by insurance for the encounter or item."
      - name: dispenses
        description: "Number of dispense events for the medication order."
      - name: total_cost
        description: "Total cost amount for the aggregated clinical or financial grain."
      - name: reason_code
        description: "Clinical or administrative reason code."
      - name: reason_description
        description: "Human-readable reason description."
      - name: is_active
        description: "True when the record has no end date and is considered active."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_observations
    description: "Gold observation fact table at observation grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: observation_at
        description: "Observation collection timestamp."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: observation_category
        description: "Observation category (for example vital-signs, laboratory)."
      - name: observation_code
        description: "Observation code from the source vocabulary."
      - name: observation_description
        description: "Human-readable observation description."
      - name: observation_value
        description: "Observation result value as captured in source."
      - name: units
        description: "Unit of measure for the observation result."
      - name: value_type
        description: "Observation value data type from source."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_immunizations
    description: "Gold immunization fact table at dose-administration grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: immunization_at
        description: "Immunization administration timestamp."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: immunization_code
        description: "Immunization product code."
      - name: immunization_description
        description: "Human-readable immunization description."
      - name: base_cost
        description: "Base cost for the clinical or supply event."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_allergies
    description: "Gold allergy fact table at allergy-record grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: allergy_start_date
        description: "Allergy or intolerance onset date."
      - name: allergy_end_date
        description: "Allergy or intolerance resolution date, if recorded."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: allergy_code
        description: "Allergy substance or product code."
      - name: code_system
        description: "Vocabulary system for the clinical or billing code."
      - name: allergy_description
        description: "Human-readable allergy description."
      - name: allergy_type
        description: "Allergy record type (for example allergy, intolerance)."
      - name: allergy_category
        description: "Allergy category (for example food, medication, environment)."
      - name: is_active
        description: "True when the record has no end date and is considered active."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_care_plans
    description: "Gold care plan fact table at care-plan grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: care_plan_id
        description: "Unique care plan identifier."
      - name: care_plan_start_date
        description: "Care plan start date."
      - name: care_plan_end_date
        description: "Care plan end date, if recorded."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: care_plan_code
        description: "Care plan type code."
      - name: care_plan_description
        description: "Human-readable care plan description."
      - name: reason_code
        description: "Clinical or administrative reason code."
      - name: reason_description
        description: "Human-readable reason description."
      - name: is_active
        description: "True when the record has no end date and is considered active."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: fct_imaging_studies
    description: "Gold imaging study fact table at DICOM instance grain."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Clinical"}'
    columns:
      - name: imaging_study_id
        description: "Unique imaging study identifier."
      - name: study_at
        description: "Imaging study timestamp."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: series_uid
        description: "DICOM series unique identifier."
      - name: bodysite_code
        description: "Imaged body site code."
      - name: bodysite_description
        description: "Human-readable body site description."
      - name: modality_code
        description: "Imaging modality code."
      - name: modality_description
        description: "Human-readable imaging modality description."
      - name: instance_uid
        description: "DICOM instance unique identifier."
      - name: sop_code
        description: "DICOM SOP class code."
      - name: sop_description
        description: "Human-readable SOP class description."
      - name: procedure_code
        description: "Procedure or service code on the transaction or clinical record."
      - name: ingested_at
        description: "Timestamp when the bronze record was ingested."
      - name: source_system
        description: "Upstream source system label (for example synthea)."
      - name: row_hash
        description: "Deterministic hash of the source row for audit and deduplication."

  - name: mart_patient_summary
    description: "One row per patient combining demographics, utilization, conditions, and financial rollups."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Patient"}'
    columns:
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
        tests: [unique, not_null]
      - name: birth_date
        description: "Patient date of birth."
      - name: death_date
        description: "Patient date of death, if recorded."
      - name: first_name
        description: "Patient given name."
      - name: last_name
        description: "Patient family name."
      - name: gender
        description: "Patient gender."
      - name: race
        description: "Patient race category from source data."
      - name: ethnicity
        description: "Patient ethnicity category from source data."
      - name: city
        description: "City name."
      - name: state
        description: "State or region code."
      - name: zip
        description: "Postal or ZIP code."
      - name: annual_income
        description: "Estimated annual household income."
      - name: lifetime_healthcare_expenses
        description: "Lifetime healthcare expenses attributed to the patient."
      - name: lifetime_coverage_amount
        description: "Lifetime insurance coverage amount attributed to the patient."
      - name: is_alive
        description: "True when the patient has no recorded death date."
      - name: age_years
        description: "Patient age in whole years at reference date or death."
      - name: age_band
        description: "Patient age segment (pediatric, adult, senior, or deceased)."
      - name: encounter_count
        description: "Count of encounters in the aggregation grain."
      - name: distinct_encounter_classes
        description: "Count of distinct encounter classes experienced by the patient."
      - name: first_encounter_date
        description: "Earliest encounter date for the patient."
      - name: last_encounter_date
        description: "Most recent encounter date for the patient."
      - name: total_encounter_claim_cost
        description: "Total claim cost across patient encounters."
      - name: total_base_encounter_cost
        description: "Total base encounter cost across patient encounters."
      - name: active_condition_count
        description: "Count of active conditions for the patient."
      - name: claim_count
        description: "Count of claims for the patient or aggregation grain."
      - name: lifetime_charges
        description: "Lifetime charge amount for the patient."
      - name: lifetime_payments
        description: "Lifetime payment amount for the patient."

  - name: mart_encounter_cost_analysis
    description: "Encounter-level cost analysis joined with clinical activity counts."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: encounter_id
        description: "Unique clinical encounter identifier."
      - name: patient_id
        description: "Unique patient identifier (Synthea UUID)."
      - name: encounter_class
        description: "Encounter setting or class (for example ambulatory, emergency, inpatient)."
      - name: encounter_start_date
        description: "Encounter start date."
      - name: organization_name
        description: "Organization or facility display name."
      - name: provider_name
        description: "Provider display name."
      - name: payer_name
        description: "Payer display name."
      - name: base_encounter_cost
        description: "Base cost attributed to the encounter in source currency."
      - name: total_claim_cost
        description: "Total claim cost linked to the encounter."
      - name: payer_coverage_amount
        description: "Amount covered by insurance for the encounter or item."
      - name: condition_count
        description: "Count of conditions linked to the encounter."
      - name: procedure_count
        description: "Count of procedures linked to the encounter."
      - name: procedure_cost
        description: "Total procedure cost linked to the encounter."
      - name: medication_count
        description: "Count of medication orders linked to the encounter."
      - name: medication_cost
        description: "Total medication cost linked to the encounter."
      - name: observation_count
        description: "Count of observations linked to the encounter."

  - name: mart_provider_panel
    description: "Provider panel metrics aggregating encounters, patients, costs, and duration."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: provider_id
        description: "Unique provider identifier."
      - name: provider_name
        description: "Provider display name."
      - name: specialty
        description: "Provider clinical specialty."
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: organization_name
        description: "Organization or facility display name."
      - name: encounter_count
        description: "Count of encounters in the aggregation grain."
      - name: distinct_patients
        description: "Count of distinct patients in the aggregation grain."
      - name: total_claim_cost
        description: "Total claim cost linked to the encounter."
      - name: avg_encounter_minutes
        description: "Average encounter duration in minutes."

  - name: mart_organization_utilization
    description: "Organization utilization summary with encounter volume and claim costs."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Operations"}'
    columns:
      - name: organization_id
        description: "Unique healthcare organization or facility identifier."
      - name: organization_name
        description: "Organization or facility display name."
      - name: city
        description: "City name."
      - name: state
        description: "State or region code."
      - name: reported_utilization
        description: "Utilization metric reported in the organization source record."
      - name: encounter_count
        description: "Count of encounters in the aggregation grain."
      - name: distinct_patients
        description: "Count of distinct patients in the aggregation grain."
      - name: distinct_providers
        description: "Count of distinct providers in the aggregation grain."
      - name: total_claim_cost
        description: "Total claim cost linked to the encounter."

  - name: mart_payer_financials
    description: "Payer financial summary linking payer attributes to encounter and medication coverage."
    config:
      query_tags: '{"layer":"gold","dbt_layer":"marts","domain":"Revenue cycle"}'
    columns:
      - name: payer_id
        description: "Unique insurance payer identifier."
      - name: payer_name
        description: "Payer display name."
      - name: ownership
        description: "Ownership classification for the payer."
      - name: amount_covered
        description: "Total amount covered by the payer."
      - name: amount_uncovered
        description: "Total amount not covered by the payer."
      - name: revenue
        description: "Reported payer or organization revenue."
      - name: encounter_count
        description: "Count of encounters in the aggregation grain."
      - name: total_payer_coverage_on_encounters
        description: "Total payer coverage amount across encounters."
      - name: total_medication_coverage
